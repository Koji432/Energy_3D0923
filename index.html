<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エネルギー変換のしくみ（3D） - 電磁誘導</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #f0f4f8; }
        
        #controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; z-index: 10; }
        
        button {
            padding: 15px 25px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        #startBtn { background-color: #27ae60; color: white; }
        #startBtn:active { background-color: #2ecc71; transform: translateY(2px); }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:active { background-color: #c0392b; transform: translateY(2px); }
        #coverBtn { background-color: #34495e; color: white; }
        #coverBtn:active { background-color: #2c3e50; transform: translateY(2px); }
    </style>
</head>
<body>

    <div id="controls">
        <button id="coverBtn">📦 カバーを外す</button>
        <button id="startBtn">▶ スタート</button>
        <button id="stopBtn">■ ストップ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let isPlaying = false;
        let ledIntensity = 0;
        let isCoverVisible = true;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 4, 0);
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- 土台と支柱 ---
        // 支柱（stand）の奥行きは0.4（z=-0.2 から z=0.2 の間）です。
        const woodMaterial = new THREE.MeshLambertMaterial({ color: 0xdeb887 });
        const base = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 6), woodMaterial);
        scene.add(base);
        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 9, 0.4), woodMaterial);
        stand.position.set(0, 4.5, 0);
        scene.add(stand);

        const rotorGroup = new THREE.Group();
        rotorGroup.position.set(0, 8, 0.8);
        scene.add(rotorGroup);

        const greenMat = new THREE.MeshLambertMaterial({ color: 0x8cc63f, side: THREE.DoubleSide });
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), greenMat);
        cap.scale.z = 0.6;
        rotorGroup.add(cap);

        const bladeGeo = new THREE.PlaneGeometry(1.2, 2.2, 10, 10);
        const positions = bladeGeo.attributes.position.array;
        for (let j = 0; j < positions.length; j += 3) {
            let x = positions[j];
            let y = positions[j+1];
            let widthScale = 0.3 + ((y + 1.1) / 2.2) * 0.7; 
            positions[j] = x * widthScale;
            positions[j+2] = Math.sin((x / 1.2) * Math.PI) * 0.3 + (y / 2.2) * 0.4;
        }
        bladeGeo.computeVertexNormals();

        for (let i = 0; i < 4; i++) {
            const blade = new THREE.Mesh(bladeGeo, greenMat);
            const angle = (i * Math.PI) / 2;
            blade.position.x = Math.cos(angle) * 1.3;
            blade.position.y = Math.sin(angle) * 1.3;
            blade.rotation.z = angle - Math.PI / 2;
            blade.rotation.x = -0.3;
            rotorGroup.add(blade);
        }

        const metalMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.6, 16), metalMat);
        shaft.rotation.x = Math.PI / 2;
        shaft.position.z = -1.8;
        rotorGroup.add(shaft);

        const magnetMaterials = [
            new THREE.MeshLambertMaterial({ color: 0x333333 }), new THREE.MeshLambertMaterial({ color: 0x333333 }),
            new THREE.MeshLambertMaterial({ color: 0xe74c3c }), new THREE.MeshLambertMaterial({ color: 0x3498db }),
            new THREE.MeshLambertMaterial({ color: 0x333333 }), new THREE.MeshLambertMaterial({ color: 0x333333 })
        ];
        const magnet = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.8), magnetMaterials);
        magnet.position.z = -3.4;
        rotorGroup.add(magnet);

        const coil = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.2), new THREE.MeshBasicMaterial({ color: 0xc47b4d, wireframe: true }));
        coil.position.set(0, 8, -2.6);
        scene.add(coil);

        const coverGeo = new THREE.BoxGeometry(2.2, 2.2, 2.5);
        const coverMat = new THREE.MeshLambertMaterial({ color: 0x222222 }); 
        const motorCover = new THREE.Mesh(coverGeo, coverMat);
        motorCover.position.set(0, 8, -2.5);
        scene.add(motorCover);

        const inductionWaves = [];
        const waveGeo = new THREE.TorusGeometry(1, 0.05, 16, 100);
        const waveMat = new THREE.MeshBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0 }); 
        
        for (let i = 0; i < 3; i++) {
            const wave = new THREE.Mesh(waveGeo, waveMat.clone()); 
            wave.position.set(0, 8, -2.6); 
            wave.rotation.x = Math.PI / 2; 
            wave.userData.progress = i / 3; 
            scene.add(wave);
            inductionWaves.push(wave);
        }

        // --- LEDグループとアノード・カソードの作成 ---
        const ledGroup = new THREE.Group();
        // 【修正】LED全体を板に近づけました。(Z=0.5)
        // 支柱の表面が Z=0.2 なので、足の長さ(0.3)を足すとちょうど板にくっつきます。
        ledGroup.position.set(0, 1.5, 0.5); 
        ledGroup.rotation.x = Math.PI / 2;
        scene.add(ledGroup);
        
        const ledMat = new THREE.MeshLambertMaterial({ 
            color: 0x222222, transparent: true, opacity: 0.9, emissive: 0xffffff, emissiveIntensity: 0 
        });
        
        const ledBody = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.5, 16), ledMat);
        ledBody.position.y = 0.25;
        ledGroup.add(ledBody);
        
        const ledHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), ledMat);
        ledHead.position.y = 0.5;
        ledGroup.add(ledHead);

        // --- 足（ピン）の作成 ---
        const pinMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
        const pinGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8); // 長さを0.3に設定
        
        // ① アノード（プラス極：右側の足）
        const anode = new THREE.Mesh(pinGeo, pinMat);
        anode.position.set(0.1, -0.15, 0); // Z=0.5から-0.15戻るので、先端はZ=0.2(板の表面)になります
        ledGroup.add(anode);
        // アノードの目印（赤いリング）を追加して生徒にわかりやすく
        const anodeMarker = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 8, 16), new THREE.MeshBasicMaterial({ color: 0xe74c3c }));
        anodeMarker.position.set(0.1, -0.05, 0);
        anodeMarker.rotation.x = Math.PI / 2;
        ledGroup.add(anodeMarker);

        // ② カソード（マイナス極：左側の足）
        const cathode = new THREE.Mesh(pinGeo, pinMat);
        cathode.position.set(-0.1, -0.15, 0);
        ledGroup.add(cathode);
        // カソードの目印（黒いリング）を追加
        const cathodeMarker = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 8, 16), new THREE.MeshBasicMaterial({ color: 0x333333 }));
        cathodeMarker.position.set(-0.1, -0.05, 0);
        cathodeMarker.rotation.x = Math.PI / 2;
        ledGroup.add(cathodeMarker);

        const pointLight = new THREE.PointLight(0xffffff, 0, 10);
        pointLight.position.y = 0.5;
        ledGroup.add(pointLight);


        // --- 導線の接続位置の精密な調整 ---
        // 足のちょうど真ん中（Z=0.35）の座標に配線を繋ぎます
        
        // 赤線（モーター ➔ アノードへ接続）
        const redCurve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0.5, 7.5, -2.6), 
            new THREE.Vector3(2.5, 4, 0.5),    
            new THREE.Vector3(0.1, 1.5, 0.35)  // 終点：アノードのピン座標
        );
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(redCurve, 20, 0.05, 8, false), new THREE.MeshLambertMaterial({ color: 0xe74c3c })));

        // 黒線（カソード ➔ モーターへ接続）
        const blackCurve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(-0.1, 1.5, 0.35), // 始点：カソードのピン座標
            new THREE.Vector3(-2.5, 4, 0.5),   
            new THREE.Vector3(-0.5, 7.5, -2.6)
        );
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(blackCurve, 20, 0.05, 8, false), new THREE.MeshLambertMaterial({ color: 0x333333 })));

        const redParticles = [];
        const blackParticles = [];
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });

        for (let i = 0; i < 5; i++) {
            const pRed = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), particleMat);
            pRed.userData.progress = i / 5; scene.add(pRed); redParticles.push(pRed);

            const pBlack = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), particleMat);
            pBlack.userData.progress = i / 5; scene.add(pBlack); blackParticles.push(pBlack);
        }

        document.getElementById('startBtn').addEventListener('click', () => { isPlaying = true; });
        document.getElementById('stopBtn').addEventListener('click', () => { isPlaying = false; });
        
        const coverBtn = document.getElementById('coverBtn');
        coverBtn.addEventListener('click', () => {
            isCoverVisible = !isCoverVisible; 
            motorCover.visible = isCoverVisible; 
            if (isCoverVisible) { coverBtn.innerText = "📦 カバーを外す"; } 
            else { coverBtn.innerText = "📦 カバーをつける"; }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                rotorGroup.rotation.z -= 0.15;

                if (!isCoverVisible) {
                    inductionWaves.forEach(wave => {
                        wave.visible = true;
                        wave.userData.progress += 0.02; 
                        if (wave.userData.progress >= 1.0) wave.userData.progress = 0; 
                        const scale = 1.0 + wave.userData.progress * 1.5;
                        wave.scale.set(scale, scale, scale);
                        wave.material.opacity = 1.0 - wave.userData.progress;
                    });
                } else {
                    inductionWaves.forEach(wave => wave.visible = false);
                }

                redParticles.forEach(p => {
                    p.userData.progress += 0.015;
                    if (p.userData.progress >= 1.0) {
                        p.userData.progress = 0;
                        ledIntensity = 1.0; 
                    }
                    p.position.copy(redCurve.getPoint(p.userData.progress));
                    p.visible = true;
                });

                blackParticles.forEach(p => {
                    p.userData.progress += 0.015;
                    if (p.userData.progress >= 1.0) p.userData.progress = 0;
                    p.position.copy(blackCurve.getPoint(p.userData.progress));
                    p.visible = true;
                });
            } else {
                redParticles.forEach(p => p.visible = false);
                blackParticles.forEach(p => p.visible = false);
                inductionWaves.forEach(wave => wave.visible = false);
            }

            if (ledIntensity > 0) {
                ledIntensity -= 0.05;
                if (ledIntensity < 0) ledIntensity = 0;
            }
            if (!isPlaying) ledIntensity = 0;

            ledMat.emissiveIntensity = ledIntensity;
            pointLight.intensity = ledIntensity * 1.5;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
