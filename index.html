<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta
      name="description"
      content="モーター内部の回転コイルを観察できる3Dモデル。"
    />
    <title>モーター3D</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lab" id="lab">
      <header class="toolbar">
        <button
          class="icon-button"
          id="reset-view"
          aria-label="視点を元に戻す"
          title="視点を元に戻す"
        >
          ↺
        </button>
      </header>
      <div class="workspace" id="workspace">
        <section class="apparatus-panel" aria-label="風力発電装置">
          <div class="viewport overview-viewport" id="overview-view">
            <div class="scene-loading">読み込み中…</div>
            <button
              class="motor-open"
              id="motor-open"
              aria-expanded="false"
              aria-controls="motor-panel"
              aria-label="モーターの内部を表示"
            >
              モーター <span aria-hidden="true">↗</span>
            </button>
          </div>
        </section>
        <aside
          class="motor-panel"
          id="motor-panel"
          aria-labelledby="motor-title"
          hidden
        >
          <div class="panel-heading">
            <h1 id="motor-title">モーター内部</h1>
            <button
              class="icon-button close-button"
              id="close-motor"
              aria-label="モーターの内部を閉じる"
              title="閉じる"
            >
              ×
            </button>
          </div>
          <div class="view-tabs" role="group" aria-label="内部の見え方">
            <button data-mode="cutaway" aria-pressed="true">中を見る</button
            ><button data-mode="exploded" aria-pressed="false">分解する</button>
          </div>
          <div class="viewport detail-viewport" id="motor-view">
            <div class="scene-loading">読み込み中…</div>
            <span class="detail-label coil-label"><i></i>コイル</span
            ><span class="detail-label magnet-label"><i></i>磁石</span>
          </div>
          <label class="field-option"
            ><input type="checkbox" id="show-field" checked />磁界</label
          >
        </aside>
      </div>
      <div class="controls">
        <button class="play-button" id="play-button">
          <span id="play-icon" aria-hidden="true">▶</span
          ><span id="play-label">回す</span>
        </button>
        <div class="speed-control">
          <div class="speed-caption">
            <label for="speed">速さ</label
            ><output id="speed-value" for="speed">60<span>%</span></output>
          </div>
          <input id="speed" type="range" min="0" max="100" value="60" />
        </div>
      </div>
      <noscript
        ><p class="error-message">JavaScriptを有効にしてください。</p></noscript
      >
    </main>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="startup.js"></script>
  </body>
</html>
